<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Rates Login</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f7fb;
        color: #1f2937;
      }
      .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: #fff;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
        text-align: center;
        max-width: 420px;
      }
      .card h1 {
        margin-bottom: 12px;
        font-size: 28px;
      }
      .card p {
        color: #64748b;
        margin-bottom: 24px;
      }
      .google-btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: #0f172a;
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
      .google-btn span {
        background: #fff;
        color: #0f172a;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Welcome to Expense Rates</h1>
        <p>Sign in with Google to load your saved rates and continue.</p>
        <a class="google-btn" href="/auth/google">
          <span>G</span>
          Continue with Google
        </a>
      </div>
    </div>
  </body>
</html>
